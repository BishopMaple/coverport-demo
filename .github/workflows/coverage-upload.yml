# Auto-generated by QualityFlow Coverage Onboarding
# Two coverage strategies:
#   1. Unit test coverage — go test -coverprofile (runs every push/PR)
#   2. Runtime product coverage — CoverPort instrumented binary (build artifact)
name: Coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # --- Unit test coverage (fast, runs on every push) ---
  unit-test-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload unit test coverage to QualityFlow
        if: always()
        env:
          QUALITYFLOW_API_KEY: ${{ secrets.QUALITYFLOW_API_KEY }}
        run: |
          curl -sk -X POST \
            -H "Content-Type: text/plain" \
            -H "X-API-Key: $QUALITYFLOW_API_KEY" \
            --data-binary @coverage.out \
            "https://qualityflow-dashboard-cnv-quality-flow.apps.cnv2.engineering.redhat.com/api/coverage/upload?org=BishopMaple&repo=coverport-demo&commit=${{ github.sha }}&branch=${{ github.ref_name }}"

  # --- Build CoverPort-instrumented binary (for runtime product coverage) ---
  coverport-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build instrumented binary
        env:
          GOCOVERDIR: /tmp/covdata
        run: |
          mkdir -p $GOCOVERDIR
          go build -cover -o app-instrumented .

      - name: Verify CoverPort server starts
        run: |
          GOCOVERDIR=/tmp/covdata timeout 5 ./app-instrumented &
          sleep 2
          curl -sf http://localhost:9095/health || echo "CoverPort health check: port 9095 not ready (may need GOCOVERDIR)"
          kill %1 2>/dev/null || true

      - name: Upload instrumented binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-binary
          path: app-instrumented
          retention-days: 7
